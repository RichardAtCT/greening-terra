name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and web templates
        uses: actions/cache@v4
        with:
          path: |
            tools/godot
          key: godot-${{ hashFiles('tools/setup_godot.sh') }}

      - name: Set up Godot
        run: tools/setup_godot.sh

      - name: Import project
        run: timeout 300 tools/godot/godot --headless --import || true

      - name: Unit and smoke tests
        run: timeout 600 tools/test.sh

      - name: Balance sim
        run: timeout 600 tools/godot/godot --headless --script tools/balance_sim.gd

      - name: Web export
        run: timeout 600 tools/export_web.sh

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 14

  deploy-itch:
    # Publishes each green main build to itch.io. Skips until the BUTLER_API_KEY secret exists.
    needs: test-and-export
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: itch-deploy
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        if: env.BUTLER_API_KEY != ''
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        if: env.BUTLER_API_KEY != ''
        with:
          name: web-build
          path: build/web

      - name: Install butler
        if: env.BUTLER_API_KEY != ''
        run: |
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d "$HOME/butler"
          chmod +x "$HOME/butler/butler"
          echo "$HOME/butler" >> "$GITHUB_PATH"

      - name: Push to itch.io
        if: env.BUTLER_API_KEY != ''
        run: tools/deploy.sh --no-export
